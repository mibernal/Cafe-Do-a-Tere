name: CI

# Revisa cada cambio antes de fusionarlo: tipos, build con servidor, build
# estático + pruebas en navegador, y migraciones + pruebas de la base de datos.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: Aplicación
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Mismo subdirectorio que tendrá el sitio en GitHub Pages.
      NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}
      NEXT_PUBLIC_SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Tipos
        run: npm run typecheck
      - name: Build con servidor (Wompi, panel, seguimiento)
        run: npm run build
      - name: Build estático (GitHub Pages)
        run: npm run build:pages
      - name: Navegador para las pruebas
        run: npx playwright install --with-deps chromium
      - name: Pruebas del sitio estático
        run: npm run test:pages
      - name: Reporte de pruebas
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  database:
    name: Base de datos
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Migraciones y pruebas de permisos y reglas de negocio
        run: bash scripts/test-sql.sh

  dependency-review:
    name: Dependencias nuevas
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    # Requiere "Dependency graph" activo (Settings > Code security). Mientras
    # tanto, informa sin bloquear el PR.
    continue-on-error: true
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure
