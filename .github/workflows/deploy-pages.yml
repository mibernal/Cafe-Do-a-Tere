name: Publicar en GitHub Pages

# Publica el sitio estático. El catálogo (precios, presentaciones y cafés
# publicados) se lee de Supabase en cada build, así que también corre:
# - cada 6 horas, para reflejar cambios hechos en el panel o en Supabase
#   (de paso mantiene activo un proyecto gratuito de Supabase);
# - a mano (Actions > Publicar en GitHub Pages > Run workflow);
# - con un evento "catalogo-actualizado" (repository_dispatch), por ejemplo
#   desde un webhook de Supabase.
on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
      - "supabase/**"
      - "tests/sql/**"
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
  repository_dispatch:
    types: [catalogo-actualizado]

permissions:
  contents: read

# Un despliegue a la vez; uno en curso no se cancela.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Configuración de GitHub Pages
        id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Comprobar el catálogo en vivo
        env:
          SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::warning title=Catálogo de referencia::Faltan los secretos NEXT_PUBLIC_SUPABASE_URL y NEXT_PUBLIC_SUPABASE_ANON_KEY. Se publica el catálogo de referencia, sin precios confirmados."
          fi
      - name: Build estático
        env:
          NEXT_PUBLIC_BASE_PATH: ${{ steps.pages.outputs.base_path }}
          NEXT_PUBLIC_SITE_URL: ${{ steps.pages.outputs.base_url }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_WHATSAPP_NUMBER: ${{ vars.NEXT_PUBLIC_WHATSAPP_NUMBER }}
          NEXT_PUBLIC_CONTACT_EMAIL: ${{ vars.NEXT_PUBLIC_CONTACT_EMAIL }}
          NEXT_PUBLIC_INSTAGRAM_URL: ${{ vars.NEXT_PUBLIC_INSTAGRAM_URL }}
          # Datos públicos del responsable para /terminos y /privacidad.
          BUSINESS_LEGAL_NAME: ${{ vars.BUSINESS_LEGAL_NAME }}
          BUSINESS_TAX_ID: ${{ vars.BUSINESS_TAX_ID }}
          BUSINESS_ADDRESS: ${{ vars.BUSINESS_ADDRESS }}
          BUSINESS_LEGAL_EMAIL: ${{ vars.BUSINESS_LEGAL_EMAIL }}
        run: npm run build:pages
      - name: Navegador para las pruebas
        run: npx playwright install --with-deps chromium
      - name: Pruebas antes de publicar
        env:
          NEXT_PUBLIC_BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: npm run test:pages
      - name: Reporte de pruebas
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: out

  deploy:
    name: Publicar
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
      - name: Verificar el sitio publicado
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          for _ in $(seq 1 12); do
            if curl -fsS "$PAGE_URL" | grep -q 'class="product-card'; then
              echo "Sitio en línea: $PAGE_URL" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 10
          done
          echo "::error::El sitio publicado no muestra cafés: $PAGE_URL"
          exit 1
